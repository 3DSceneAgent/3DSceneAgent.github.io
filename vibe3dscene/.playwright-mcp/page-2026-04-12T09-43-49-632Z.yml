          - generic [ref=e56]: Overview
          - heading "A layered runtime, not just a Blender bot" [level=2] [ref=e57]
        - paragraph [ref=e58]: The current system separates entry surfaces, request orchestration, tool mediation, Blender execution, and persistence so the same core runtime can drive web generation, Blender-side chat, and service-oriented deployment.
      - generic [ref=e60]:
        - article [ref=e61]:
          - heading "Runtime orchestration" [level=3] [ref=e62]
          - paragraph [ref=e63]: FastAPI receives the request, resolves thread ownership and VLM configuration, then reuses or rebuilds the LangGraph instance for that thread before execution starts.
        - article [ref=e64]:
          - heading "Tool surface" [level=3] [ref=e65]
          - paragraph [ref=e66]: MCP exposes the agent-callable tool registry while a small set of verification-only Blender commands remain internal to the graph for observation and geometry checks.
        - article [ref=e67]:
          - heading "Durability and recovery" [level=3] [ref=e68]
          - paragraph [ref=e69]: "Redis ownership metadata, persisted `.blend` files, and stored image assets let sessions recover after restarts and keep long-running threads stable across workers."
