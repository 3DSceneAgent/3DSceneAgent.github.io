          - generic [ref=e44]: Overview
          - heading "A layered runtime, not just a Blender bot" [level=2] [ref=e45]
        - paragraph [ref=e46]: The current system separates entry surfaces, request orchestration, tool mediation, Blender execution, and persistence so the same core runtime can drive web generation, Blender-side chat, and service-oriented deployment.
      - generic [ref=e48]:
        - article [ref=e49]:
          - heading "Runtime orchestration" [level=3] [ref=e50]
          - paragraph [ref=e51]: FastAPI receives the request, resolves thread ownership and VLM configuration, then reuses or rebuilds the LangGraph instance for that thread before execution starts.
        - article [ref=e52]:
          - heading "Tool surface" [level=3] [ref=e53]
          - paragraph [ref=e54]: MCP exposes the agent-callable tool registry while a small set of verification-only Blender commands remain internal to the graph for observation and geometry checks.
        - article [ref=e55]:
          - heading "Durability and recovery" [level=3] [ref=e56]
          - paragraph [ref=e57]: "Redis ownership metadata, persisted `.blend` files, and stored image assets let sessions recover after restarts and keep long-running threads stable across workers."
